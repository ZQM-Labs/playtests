site_name: Playtests
site_description: Playtests documentation
site_author: ZQM Labs
repo_url: https://github.com/ZQM-Labs/playtests

theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true

nav:
  - Home: index.md